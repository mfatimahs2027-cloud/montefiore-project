<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montefiore Plaza Redesign Proposal</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --green: #1f7a4d;
      --deep-green: #0f3d2e;
      --gold: #f4b942;
      --cream: #fff8e8;
      --blue: #1d4e89;
      --purple: #5d3a9b;
      --orange: #e76f51;
      --dark: #17202a;
      --white: #ffffff;
      --gray: #f2f4f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      background:
        linear-gradient(rgba(255,248,232,0.88), rgba(232,246,239,0.88)),
        url('https://i.pinimg.com/736x/82/b8/a2/82b8a2ad2a3a229e86e7385270cacaf3.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      color: #1a1a1a;
      font-size: 18px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      border: 4px solid var(--green);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 10px;
      background: var(--dark);
      color: white;
      padding: 10px;
      z-index: 1000;
    }

    .skip-link:focus {
      top: 10px;
    }

    header {
      background: linear-gradient(rgba(15, 61, 46, 0.88), rgba(29, 78, 137, 0.88));
      color: white;
      padding: 90px 24px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(2.2rem, 5vw, 4.7rem);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    header p {
      max-width: 900px;
      margin: 0 auto 28px;
      font-size: 1.25rem;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--dark);
      text-decoration: none;
      font-weight: 800;
    }

    .btn.secondary {
      background: white;
      color: var(--deep-green);
    }

    nav {
      background: var(--dark);
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
      font-size: 0.95rem;
    }

    nav a:hover {
      background: var(--gold);
      color: var(--dark);
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 35px 20px;
    }

    section {
      margin-bottom: 55px;
      background: rgba(255, 255, 255, 0.95);
      padding: 32px;
      border-radius: 26px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 2.3rem;
      color: var(--deep-green);
      margin-bottom: 16px;
    }

    h3 {
      color: var(--blue);
      margin: 22px 0 8px;
      font-size: 1.35rem;
    }

    .highlight {
      background: #fff0c2;
      border-left: 8px solid var(--gold);
      padding: 18px;
      border-radius: 14px;
      margin: 20px 0;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: var(--gray);
      padding: 22px;
      border-radius: 20px;
      border-top: 8px solid var(--green);
    }

    .card:nth-child(2n) { border-top-color: var(--blue); }
    .card:nth-child(3n) { border-top-color: var(--orange); }
    .card:nth-child(4n) { border-top-color: var(--purple); }

    .big-number {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--purple);
      display: block;
    }
  </style>
</head>
